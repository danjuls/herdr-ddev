onboarding = false

[ui.toast]
delivery = "system"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status", { token = "$ddev", rules = [{ starts_with = "●", fg = "#a6e3a1" }, { starts_with = "◐", fg = "#f9e2af" }, { starts_with = "◌", fg = "#f9e2af" }, { starts_with = "○", dim = true }] }],
]

[theme]
name = "catppuccin"
auto_switch = false

# vim-herdr-navigation: Ctrl+h/j/k/l across Neovim splits and herdr panes
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

# reviewr: toggle the diff review pane
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr diff pane"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "danjuls.ddev.toggle"
description = "ddev: start/stop project"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "danjuls.ddev.open"
description = "ddev: open site"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "danjuls.ddev.picker"
description = "ddev: projects"
